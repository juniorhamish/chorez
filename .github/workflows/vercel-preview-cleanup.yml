name: Vercel Preview Deployment Cleanup

on:
  pull_request:
    types: [closed]

jobs:
  delete-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Vercel preview deployments for this branch
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # Extra safety net: never run this against the production branch, no
          # matter what triggered the workflow or what the API returns.
          if [ "${GIT_BRANCH}" = "main" ]; then
            echo "Refusing to clean up deployments for the production branch 'main'; aborting."
            exit 1
          fi

          TEAM_QS=""
          if [ -n "${VERCEL_ORG_ID}" ]; then
            TEAM_QS="&teamId=${VERCEL_ORG_ID}"
          fi

          echo "Looking up Vercel deployments for branch '${GIT_BRANCH}'..."
          # NOTE: the correct Vercel API filter param is "branch" (NOT "gitBranch").
          # Using an unrecognized param name causes Vercel to silently ignore the
          # filter and return EVERY deployment for the project (production included),
          # which previously led to production being deleted. "target=preview" is
          # kept as a second, independent safety net so production can never match
          # even if the branch filter alone were ever wrong again.
          RESPONSE=$(curl -sf \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&branch=${GIT_BRANCH}&target=preview&limit=100${TEAM_QS}")

          DEPLOYMENT_IDS=$(echo "${RESPONSE}" | jq -r '.deployments[] | select(.target != "production") | .uid')

          if [ -z "${DEPLOYMENT_IDS}" ]; then
            echo "No Vercel preview deployments found for branch '${GIT_BRANCH}'; nothing to delete."
            exit 0
          fi

          for id in ${DEPLOYMENT_IDS}; do
            echo "Deleting Vercel deployment ${id}..."
            curl -sf -X DELETE \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v13/deployments/${id}?${TEAM_QS#&}" \
              || echo "Warning: failed to delete deployment ${id} (it may already be gone)."
          done
